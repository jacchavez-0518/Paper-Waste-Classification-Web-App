<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Teachable Machine — Image Classifier</title>
<style>
  :root {
    --bg: #0f1117;
    --panel: #171a23;
    --border: #262a36;
    --text: #e8eaf0;
    --muted: #8b93a7;
    --accent: #4f8cff;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: var(--bg);
    color: var(--text);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  .app {
    width: 100%;
    max-width: 720px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px;
  }

  h1 { margin: 0 0 4px; font-size: 1.35rem; letter-spacing: -0.01em; }

  .sub { margin: 0 0 22px; color: var(--muted); font-size: 0.875rem; }

  .controls { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 22px; }

  button {
    font: inherit;
    font-weight: 500;
    font-size: 0.9rem;
    padding: 10px 18px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text);
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s, opacity 0.15s;
  }

  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: 0.45; cursor: not-allowed; }

  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover:not(:disabled) { background: #3d7bf0; }

  .stage { display: flex; gap: 20px; flex-wrap: wrap; align-items: flex-start; }

  #webcam-container canvas {
    width: 260px;
    height: 260px;
    border-radius: 14px;
    border: 1px solid var(--border);
    background: #000;
    display: block;
  }

  #webcam-container:empty::after {
    content: "Camera off";
    display: flex;
    align-items: center;
    justify-content: center;
    width: 260px;
    height: 260px;
    border-radius: 14px;
    border: 1px dashed var(--border);
    color: var(--muted);
    font-size: 0.8rem;
  }

  .labels { flex: 1; min-width: 220px; }

  .label-row { margin-bottom: 14px; }

  .label-head {
    display: flex;
    justify-content: space-between;
    font-size: 0.85rem;
    margin-bottom: 6px;
  }

  .label-head .prob { color: var(--muted); font-variant-numeric: tabular-nums; }

  .bar { height: 8px; border-radius: 99px; background: var(--border); overflow: hidden; }

  .bar > span {
    display: block;
    height: 100%;
    width: 0;
    border-radius: 99px;
    background: var(--accent);
    transition: width 0.12s linear;
  }

  .status { margin-top: 20px; font-size: 0.8rem; color: var(--muted); min-height: 1.2em; }
  .status.error { color: #ff6b6b; }

  /* ---- Mobile: stack the camera above the labels ---- */
  @media (max-width: 620px) {
    body { align-items: flex-start; padding: 16px; }
    .app { padding: 20px; }
    .stage { flex-direction: column; }
    #webcam-container canvas,
    #webcam-container:empty::after {
      width: 100%;
      height: auto;
      aspect-ratio: 1;
    }
    .labels { width: 100%; min-width: 0; }
  }
</style>
</head>
<body>

<div class="app">
  <h1>Teachable Machine Image Model</h1>
  <p class="sub">Point your camera at the object and watch the predictions update live.</p>

  <div class="controls">
    <button id="startBtn" class="primary" type="button">Start camera</button>
    <button id="stopBtn" type="button" disabled>Stop</button>
  </div>

  <div class="stage">
    <div id="webcam-container"></div>
    <div id="label-container" class="labels"></div>
  </div>

  <div id="status" class="status"></div>
</div>

<!-- Libraries FIRST, in this order, no defer/async -->
<script src="[cdn.jsdelivr.net](https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js)"></script>
<script src="[cdn.jsdelivr.net](https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js)"></script>

<script>
(function () {
  "use strict";

  /* ============================================================
     CONFIG — your model lives here
     ============================================================ */
  const CONFIG = {
    modelURL: "[teachablemachine.withgoogle.com](https://teachablemachine.withgoogle.com/models/dcKqWgKEP/model.json)",
    metadataURL: "[teachablemachine.withgoogle.com](https://teachablemachine.withgoogle.com/models/dcKqWgKEP/metadata.json)",
    size: 260,     // canvas width/height in px
    flip: true     // mirror the webcam
  };

  /* ============================================================
     DOM
     ============================================================ */
  const startBtn = document.getElementById("startBtn");
  const stopBtn = document.getElementById("stopBtn");
  const statusEl = document.getElementById("status");
  const webcamContainer = document.getElementById("webcam-container");
  const labelContainer = document.getElementById("label-container");

  /* ============================================================
     STATE
     ============================================================ */
  let model = null;
  let webcam = null;
  let maxPredictions = 0;
  let running = false;
  let rafId = null;
  let labelEls = [];
  let lastStatusKey = "";

  function setStatus(message, isError) {
    const key = (isError ? "e:" : "i:") + message;
    if (key === lastStatusKey) return;
    lastStatusKey = key;
    statusEl.textContent = message;
    statusEl.classList.toggle("error", Boolean(isError));
  }

  /* ============================================================
     LIBRARY GUARD — catches a failed CDN load with a clear message
     ============================================================ */
  function checkLibraries() {
    if (typeof tf === "undefined") {
      throw new Error("TensorFlow.js did not load. The CDN script is blocked or unreachable.");
    }
    if (typeof tmImage === "undefined") {
      throw new Error("Teachable Machine library did not load. Check the script tag above.");
    }
  }

  /* ============================================================
     LOAD MODEL
     ============================================================ */
  async function loadModel() {
    if (model) return;                 // already loaded, don't re-download
    setStatus("Loading model…");

    model = await tmImage.load(CONFIG.modelURL, CONFIG.metadataURL);
    maxPredictions = model.getTotalClasses();
  }

  /* ============================================================
     BUILD ONE ROW PER CLASS
     ============================================================ */
  function buildLabelRows() {
    labelContainer.innerHTML = "";
    labelEls = [];

    for (let i = 0; i < maxPredictions; i++) {
      const row = document.createElement("div");
      row.className = "label-row";

      const head = document.createElement("div");
      head.className = "label-head";

      const name = document.createElement("span");
      name.className = "name";
      name.textContent = "…";

      const prob = document.createElement("span");
      prob.className = "prob";
      prob.textContent = "0.00";

      head.append(name, prob);

      const bar = document.createElement("div");
      bar.className = "bar";
      const fill = document.createElement("span");
      bar.appendChild(fill);

      row.append(head, bar);
      labelContainer.appendChild(row);

      labelEls.push({ name, prob, fill });
    }
  }

  /* ============================================================
     PREDICT
     ============================================================ */
  async function predict() {
    if (!model || !webcam || !running) return;

    const prediction = await model.predict(webcam.canvas);

    // Keep the original index so each result maps to its own row
    const sorted = prediction
      .map((p, i) => ({ className: p.className, probability: p.probability, i }))
      .sort((a, b) => b.probability - a.probability);

    for (let rank = 0; rank < sorted.length; rank++) {
      const p = sorted[rank];
      const el = labelEls[p.i];
      if (!el) continue;

      const pct = (p.probability * 100).toFixed(1);
      el.name.textContent = (rank === 0 ? "▸ " : "") + p.className;
      el.name.style.fontWeight = rank === 0 ? "600" : "400";
      el.prob.textContent = pct + "%";
      el.fill.style.width = pct + "%";
      el.fill.style.opacity = rank === 0 ? "1" : "0.5";
    }
  }

  /* ============================================================
     CAMERA
     ============================================================ */
  async function startCamera() {
    webcam = new tmImage.Webcam(CONFIG.size, CONFIG.size, CONFIG.flip);
    await webcam.setup();   // requests camera permission
    await webcam.play();    // starts the video stream
  }

  async function loop() {
    if (!running) return;
    webcam.update();
    await predict();
    if (running) rafId = window.requestAnimationFrame(loop);
  }

  /* ============================================================
     LIFECYCLE
     ============================================================ */
  async function start() {
    if (running) return;
    startBtn.disabled = true;
    setStatus("Requesting camera access…");

    try {
      checkLibraries();
      await loadModel();
      buildLabelRows();
      await startCamera();

      webcamContainer.innerHTML = "";
      webcamContainer.appendChild(webcam.canvas);

      running = true;
      stopBtn.disabled = false;
      setStatus("Running — " + maxPredictions + " classes loaded.");
      rafId = window.requestAnimationFrame(loop);
    } catch (err) {
      console.error(err);
      startBtn.disabled = false;
      running = false;
      stopBtn.disabled = true;

      if (err && /permission|denied|NotAllowed/i.test(err.name + " " + err.message)) {
        setStatus("Camera permission denied. Allow camera access and try again.", true);
      } else {
        setStatus("Could not start: " + (err && err.message ? err.message : err), true);
      }
    }
  }

  function stop() {
    running = false;
    if (rafId !== null) {
      window.cancelAnimationFrame(rafId);
      rafId = null;
    }
    if (webcam && typeof webcam.stop === "function") webcam.stop();
    webcam = null;
    webcamContainer.innerHTML = "";
    labelContainer.innerHTML = "";
    labelEls = [];
    startBtn.disabled = false;
    stopBtn.disabled = true;
    setStatus("Stopped.");
  }

  startBtn.addEventListener("click", start);
  stopBtn.addEventListener("click", stop);
  window.addEventListener("pagehide", () => { if (running) stop(); });
})();
</script>

</body>
</html>
