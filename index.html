<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Teachable Machine Image Model</title>
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         padding:24px; background:#0f1117; color:#e8eaf0;
         font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .app { width:100%; max-width:720px; background:#171a23; border:1px solid #262a36;
         border-radius:16px; padding:28px; }
  h1 { margin:0 0 4px; font-size:1.35rem; }
  .sub { margin:0 0 22px; color:#8b93a7; font-size:.875rem; }
  .controls { display:flex; gap:10px; margin-bottom:22px; }
  button { font:inherit; font-weight:500; font-size:.9rem; padding:10px 18px; border-radius:10px;
           border:1px solid #262a36; background:transparent; color:#e8eaf0; cursor:pointer; }
  button:disabled { opacity:.45; cursor:not-allowed; }
  #startBtn { background:#4f8cff; border-color:#4f8cff; color:#fff; }
  .stage { display:flex; gap:20px; flex-wrap:wrap; align-items:flex-start; }
  #webcam-container canvas { width:260px; height:260px; border-radius:14px;
                             border:1px solid #262a36; background:#000; display:block; }
  #label-container { flex:1; min-width:220px; }
  #label-container div { margin-bottom:10px; font-size:.9rem; }
  .status { margin-top:20px; font-size:.8rem; color:#8b93a7; min-height:1.2em; }
  .status.error { color:#ff6b6b; }
</style>
</head>
<body>

<div class="app">
  <h1>Teachable Machine Image Model</h1>
  <p class="sub">Point your camera at the object and watch the predictions update live.</p>

  <div class="controls">
    <button id="startBtn" type="button">Start camera</button>
    <button id="stopBtn" type="button" disabled>Stop</button>
  </div>

  <div class="stage">
    <div id="webcam-container"></div>
    <div id="label-container"></div>
  </div>

  <div id="status" class="status"></div>
</div>

<script src="libs/tf.min.js"></script>
<script src="libs/teachablemachine-image.min.js"></script>

<script>
(function () {
  "use strict";

  const URL = "[teachablemachine.withgoogle.com](https://teachablemachine.withgoogle.com/models/dcKqWgKEP/)";

  const startBtn = document.getElementById("startBtn");
  const stopBtn = document.getElementById("stopBtn");
  const statusEl = document.getElementById("status");
  const webcamContainer = document.getElementById("webcam-container");
  const labelContainer = document.getElementById("label-container");

  let model = null, webcam = null, maxPredictions = 0;
  let running = false, rafId = null, lastStatus = "";

  function setStatus(msg, isError) {
    if (msg === lastStatus) return;
    lastStatus = msg;
    statusEl.textContent = msg;
    statusEl.classList.toggle("error", !!isError);
  }

  async function start() {
    if (running) return;
    startBtn.disabled = true;
    setStatus("Loading model…");

    try {
      if (typeof tf === "undefined") throw new Error("tf.min.js didn't load — check the libs folder.");
      if (typeof tmImage === "undefined") throw new Error("teachablemachine-image.min.js didn't load — check the libs folder.");

      model = await tmImage.load(URL + "model.json", URL + "metadata.json");
      maxPredictions = model.getTotalClasses();

      webcam = new tmImage.Webcam(260, 260, true);
      await webcam.setup();
      await webcam.play();

      webcamContainer.innerHTML = "";
      webcamContainer.appendChild(webcam.canvas);

      labelContainer.innerHTML = "";
      for (let i = 0; i < maxPredictions; i++) {
        labelContainer.appendChild(document.createElement("div"));
      }

      running = true;
      stopBtn.disabled = false;
      setStatus("Running — " + maxPredictions + " classes loaded.");
      window.requestAnimationFrame(loop);

    } catch (err) {
      console.error(err);
      startBtn.disabled = false;
      stopBtn.disabled = true;
      running = false;
      const m = (err && err.message) ? err.message : String(err);
      if (/permission|denied|NotAllowed/i.test(m)) {
        setStatus("Camera permission denied. Allow camera access and try again.", true);
      } else {
        setStatus("Could not start: " + m, true);
      }
    }
  }

  async function loop() {
    if (!running) return;
    webcam.update();
    await predict();
    if (running) rafId = window.requestAnimationFrame(loop);
  }

  async function predict() {
    if (!model || !webcam || !running) return;
    const prediction = await model.predict(webcam.canvas);
    for (let i = 0; i < maxPredictions; i++) {
      const el = labelContainer.childNodes[i];
      if (!el) continue;
      el.textContent = prediction[i].className + ": " + prediction[i].probability.toFixed(2);
    }
  }

  function stop() {
    running = false;
    if (rafId !== null) { window.cancelAnimationFrame(rafId); rafId = null; }
    if (webcam && typeof webcam.stop === "function") webcam.stop();
    webcam = null;
    webcamContainer.innerHTML = "";
    labelContainer.innerHTML = "";
    startBtn.disabled = false;
    stopBtn.disabled = true;
    setStatus("Stopped.");
  }

  startBtn.addEventListener("click", start);
  stopBtn.addEventListener("click", stop);
  window.addEventListener("pagehide", () => { if (running) stop(); });
})();
</script>

</body>
</html>
